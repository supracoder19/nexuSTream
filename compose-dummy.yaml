name: nexus-stream-development
services:
  core-service:
    build:
      context: ./services/core-service
      dockerfile: dockerfile
    ports:
      - "3000:10000"
    depends_on:
      - redis-cache
      - minio
      - db-service
    volumes: 
      - ./services/core-service:/builder/core-service
    env_file:
      - ./services/core-service/.env.dummy
    networks:
      - nexus-network 

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: DockerFile
    ports:
      - "3050:3050"
    env_file:
      - ./services/gateway-service/.env.dummy
    depends_on:
      - redis-cache
    volumes: 
      - ./services/gateway-service:/app/gateway-service
      - /app/gateway-service/node_modules
    command: npm run test                          # Changed 'test' to 'dev' for live coding
    networks:
      - nexus-network

  web-client:
    build: 
      context: ./services/web-client
      dockerfile: DockerFile
    depends_on:
      - gateway-service
    ports:
      - "4000:4000"
    env_file:
      - ./services/web-client/.env.dummy
    volumes:
      - ./services/web-client:/app/web-client
      - /app/web-client/node_modules
    networks:
      - nexus-network

  nginx-iac:
    build:
      context: ./Infrastructure/nginx
      dockerfile: Dockerfile
    ports:
      - "8081:80" 
    volumes:
      - ./Infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    networks:
      - nexus-network

  redis-cache:
    build: 
      context: ./Infrastructure/redis-cache
      dockerfile: dockerfile
    volumes:
      - redis_data:/data
      - ./Infrastructure/redis-cache/redis.conf:/usr/local/etc/redis/redis.conf
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - nexus-network

  minio:
    image: minio/minio:latest
    container_name: minio_r2_simulator
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_SERVER_URL: "http://localhost:9000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nexus-network
  video-processor:
    build:
      context: ./services/video-processor
      dockerfile: DockerFile
    container_name: video-processor-service
    ports:
      - "4781:4781"
    volumes:
      - ./services/video-processor/:/app/video-processor/
      - ./services/video-processor-service/temp-storage:/app/video-processor/temp-storage # Mount local disk to inspect processing steps
      - /app/video-processor/node_modules
    env_file:
      - ./services/video-processor/.env.dummy
    networks:
      - nexus-network
    depends_on:
      - redis-cache
    command: npm run dev
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin password123) do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb myminio/nexustream --ignore-existing;
      /usr/bin/mc anonymous set download myminio/nexustream;
      exit 0;
      "
    networks:
      - nexus-network
  db-service:
    image: mariadb:11.8.8-noble
    container_name: db-service
    ports:
      - "10023:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=supradb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - nexus-network
networks:
  nexus-network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  minio_data:
  kafka_data: